[project]
name = "transcribe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.27.0.42",
    "pyannote-audio>=4.0.7",
    "torch>=2.14.1",
]

# PyPI torch on Windows is CPU-only (Linux wheels already have CUDA); pull the CUDA build so --diarize can use the GPU.
# cu126 matches the CUDA 12 runtime faster-whisper (CTranslate2) already uses.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
